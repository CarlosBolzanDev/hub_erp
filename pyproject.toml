[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "registro-operacional"
version = "0.2.0"
description = "Registro Operacional de Decisões e Evidências"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "Pillow>=10.0",
  "pytesseract>=0.3",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "loguru>=0.7",
  "qdarktheme>=2.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["registro_operacional*"]
exclude = ["data*", "alembic*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
