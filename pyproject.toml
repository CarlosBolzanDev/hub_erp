[project]
name = "bo-operacional"
version = "0.1.0"
description = "Sistema local de gerenciamento de BOs operacionais"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "SQLAlchemy>=2.0",
  "Pillow>=10.0",
  "pytesseract>=0.3",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pydantic>=2.7"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
