<!DOCTYPE html><html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Pedidos</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="container"><aside class="sidebar"><h2>Hub ERP</h2><a href="/dashboard">Dashboard</a><a href="/orders">Pedidos</a></aside>
<main class="main"><h1>Pedidos</h1><form method="get"><select name="status"><option value="">Todos</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option></select><input type="date" name="date"><button>Filtrar</button></form>
<table><tr><th>ID</th><th>Usuário</th><th>Produto</th><th>Qtd</th><th>Status</th><th>Total</th></tr><tr th:each="o : ${orders.content}"><td th:text="${o.id}"></td><td th:text="${o.user.username}"></td><td th:text="${o.product.name}"></td><td th:text="${o.quantity}"></td><td th:text="${o.status}"></td><td th:text="${o.totalValue}"></td></tr></table>
<form method="post" action="/orders"><select name="userId"><option th:each="u : ${users}" th:value="${u.id}" th:text="${u.username}"></option></select><select name="productId"><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}"></option></select><input type="number" name="quantity" min="1" value="1"><select name="status"><option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option></select><button>Salvar</button></form></main></div></body></html>
