<!DOCTYPE html><html lang="pt-br" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Produtos</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="container"><aside class="sidebar"><h2>Hub ERP</h2><a href="/dashboard">Dashboard</a><a href="/products">Produtos</a></aside>
<main class="main"><h1>Produtos</h1><table><tr><th>ID</th><th>Nome</th><th>Preço</th><th>Estoque</th><th>Categoria</th></tr><tr th:each="p : ${products.content}"><td th:text="${p.id}"></td><td th:text="${p.name}"></td><td th:text="${p.price}"></td><td th:text="${p.stock}"></td><td th:text="${p.category.name}"></td></tr></table>
<form method="post" action="/products"><input name="name" required placeholder="Nome"><input name="sku" placeholder="SKU"><input name="price" type="number" step="0.01" required><input name="stock" type="number" required><select name="categoryId"><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select><button>Salvar</button></form>
<form method="post" action="/api/upload" enctype="multipart/form-data"><input type="file" name="file" required><button>Upload</button></form></main></div></body></html>
